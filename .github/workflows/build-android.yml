name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'games.html'
      - 'progress.js'
      - 'voice-preferences.js'
      - 'game-audio.js'
      - 'cinematic-fx.js'
      - 'character-rotation.js'
      - 'abdulhay.webp'
      - 'abdulmuhaimin.webp'
      - 'aisha.webp'
      - 'rabbit.png'
      - 'assets/audio/**'
      - 'sw.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '*.jpg'
      - '*.png'
      - '*.webp'
      - 'audio/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Capacitor
        run: npm install
      - name: Prepare offline web bundle
        run: |
          mkdir -p android-web
          cp index.html games.html progress.js voice-preferences.js game-audio.js cinematic-fx.js character-rotation.js sw.js manifest.webmanifest icon.svg abdulhay.webp abdulmuhaimin.webp aisha.webp rabbit.png cat.png boy.jpg girl.jpg girl.png cat.jpg rabbit.jpg android-web/
          mkdir -p android-web/assets/audio
          cp assets/audio/*.ogg assets/audio/LICENSE-KENNEY-CC0.txt android-web/assets/audio/
          cp -R assets/audio/letters android-web/assets/audio/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync local web assets
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-muslim-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: رحلة المسلم الصغير - أحدث إصدار Android
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
