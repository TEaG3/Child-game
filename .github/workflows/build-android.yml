name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'games.html'
      - 'progress.js'
      - 'voice-preferences.js'
      - 'game-audio.js'
      - 'cinematic-fx.js'
      - 'character-rotation.js'
      - 'abdulhay.webp'
      - 'abdulmuhaimin.webp'
      - 'aisha.webp'
      - 'rabbit.png'
      - 'assets/audio/**'
      - 'sw.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '*.jpg'
      - '*.png'
      - '*.webp'
      - 'audio/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Capacitor
        run: npm install
      - name: Prepare offline web bundle
        run: |
          mkdir -p android-web
          cp index.html games.html progress.js voice-preferences.js game-audio.js cinematic-fx.js education-enhancements.js character-rotation.js sw.js manifest.webmanifest icon.svg abdulhay.webp abdulmuhaimin.webp aisha.webp rabbit.png cat.png boy.jpg girl.jpg girl.png cat.jpg rabbit.jpg android-web/
          mkdir -p android-web/assets/audio
          cp assets/audio/*.ogg assets/audio/LICENSE-KENNEY-CC0.txt android-web/assets/audio/
          cp -R assets/audio/letters android-web/assets/audio/
          test -s android-web/cat.png
          test -s android-web/assets/audio/letters/names/alif.mp3
          test -s android-web/assets/audio/letters/sounds/alif.mp3
          node --check android-web/character-rotation.js
          node --check android-web/progress.js
          node --check android-web/voice-preferences.js
          node --check android-web/education-enhancements.js
          node --check android-web/cinematic-fx.js
          node --check android-web/game-audio.js
          python - <<'PY'
          import re, subprocess
          html = open("android-web/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          for number, source in enumerate(scripts, 1):
              if source.strip():
                  result = subprocess.run(["node", "--check"], input=source, text=True, capture_output=True)
                  if result.returncode:
                      raise SystemExit("Inline script %s failed syntax check:\n%s" % (number, result.stderr))
          print("All inline JavaScript blocks passed syntax checks.")
          PY
      - name: Generate Android project
        run: npx cap add android
      - name: Enable Android TV and remote launch support
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          for feature in root.findall("uses-feature"):
              if feature.get(ns + "name") == "android.hardware.touchscreen":
                  feature.set(ns + "required", "false")
                  break
          else:
              feature = ET.Element("uses-feature")
              feature.set(ns + "name", "android.hardware.touchscreen")
              feature.set(ns + "required", "false")
              root.insert(0, feature)
          for supports in root.findall("supports-screens"):
              root.remove(supports)
          supports = ET.Element("supports-screens")
          for size in ("smallScreens", "normalScreens", "largeScreens", "xlargeScreens"):
              supports.set(ns + size, "true")
          root.insert(1, supports)
          found = False
          for activity in root.iter("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [x.get(ns + "name") for x in intent.findall("action")]
                  categories = [x.get(ns + "name") for x in intent.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      if "android.intent.category.LEANBACK_LAUNCHER" not in categories:
                          category = ET.SubElement(intent, "category")
                          category.set(ns + "name", "android.intent.category.LEANBACK_LAUNCHER")
                      found = True
          if not found:
              raise SystemExit("Could not find the main launcher activity to enable Android TV.")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Android TV launcher category and touchscreen-optional support configured.")
          PY
      - name: Sync local web assets
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-muslim-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: رحلة المسلم الصغير - أحدث إصدار Android
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
