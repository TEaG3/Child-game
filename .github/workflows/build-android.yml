name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'letters/**'
      - 'games.html'
      - 'education-enhancements.js'
      - 'progress.js'
      - 'voice-preferences.js'
      - 'game-audio.js'
      - 'cinematic-fx.js'
      - 'character-rotation.js'
      - 'abdulhay.webp'
      - 'abdulmuhaimin.webp'
      - 'aisha.webp'
      - 'rabbit.png'
      - 'assets/audio/**'
      - 'sw.js'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '*.jpg'
      - '*.png'
      - '*.webp'
      - 'audio/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Capacitor
        run: npm install
      - name: Prepare offline web bundle
        run: |
          mkdir -p android-web
          cp index.html games.html progress.js voice-preferences.js game-audio.js cinematic-fx.js education-enhancements.js character-rotation.js sw.js version.json manifest.webmanifest icon.svg abdulhay.webp abdulmuhaimin.webp aisha.webp rabbit.png cat.png boy.jpg girl.jpg girl.png cat.jpg rabbit.jpg android-web/
          cp -R letters android-web/
          mkdir -p android-web/assets/audio
          cp assets/audio/*.ogg assets/audio/LICENSE-KENNEY-CC0.txt android-web/assets/audio/
          cp -R assets/audio/letters android-web/assets/audio/
          test -s android-web/cat.png
          test -s android-web/version.json
          test -s android-web/letters/index.html
          test -s android-web/letters/script.js
          test -s android-web/letters/style.css
          test -s android-web/assets/audio/letters/names/alif.mp3
          test -s android-web/assets/audio/letters/sounds/alif.mp3
          node --check android-web/character-rotation.js
          node --check android-web/progress.js
          node --check android-web/voice-preferences.js
          node --check android-web/education-enhancements.js
          node --check android-web/cinematic-fx.js
          node --check android-web/game-audio.js
          python - <<'PY'
          import re, subprocess
          html = open("android-web/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          for number, source in enumerate(scripts, 1):
              if source.strip():
                  result = subprocess.run(["node", "--check"], input=source, text=True, capture_output=True)
                  if result.returncode:
                      raise SystemExit("Inline script %s failed syntax check:\n%s" % (number, result.stderr))
          print("All inline JavaScript blocks passed syntax checks.")
          PY
      - name: Generate Android project
        run: npx cap add android
      - name: Sync local web assets
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build signed release APK when signing secrets are configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          block = '''\n\nandroid {\n    signingConfigs {\n        release {\n            storeFile rootProject.file("release-key.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n'''
          if "signingConfig signingConfigs.release" in text:
              raise SystemExit("Release signing config already exists")
          path.write_text(text + block)
          PY
          cd android
          ./gradlew assembleRelease
      - name: Upload signed release APK artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: little-muslim-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: رحلة المسلم الصغير - أحدث إصدار Android
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-muslim-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: رحلة المسلم الصغير - أحدث إصدار Android
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
